<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Iqra Jannat-UL-Atfal School</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">

    <div class="login-logo-wrap">
      <div class="login-logo">
        <img src="{{ url_for('static', filename='images/logo.webp') }}" alt="School Logo">
      </div>
    </div>

    <div class="login-school-name">Iqra Jannat-UL-Atfal School</div>
    <p class="login-sub">Management System — Please sign in to continue</p>

    <div class="login-divider"><span>Login</span></div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>
      <div class="form-group" style="margin-bottom:24px">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;font-size:14px">
        Sign In →
      </button>
    </form>

    <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text3);font-weight:500">
      Iqra Jannat-UL-Atfal School · Admin System
    </p>
  </div>
</div>
</body>
</html>
