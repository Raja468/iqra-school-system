<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Admin{% endblock %} — Iqra Jannat-UL-Atfal School</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<!-- Glass overlay for mobile -->
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div>

<!-- ===== SIDEBAR ===== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-logo">
      <img src="{{ url_for('static', filename='images/logo.webp') }}" alt="School Logo">
    </div>
    <div>
      <div class="brand-name">Iqra Jannat-UL-Atfal</div>
      <div class="brand-tagline"><i class="fas fa-crown"></i> Admin Portal</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">
      <div class="sidebar-label">Main</div>
      <a href="/admin/dashboard" class="nav-item {% if request.path == '/admin/dashboard' %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-th-large"></i></span> Dashboard
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Management</div>
      <a href="/admin/students"   class="nav-item {% if '/students'   in request.path %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-user-graduate"></i></span> Students
      </a>
      <a href="/admin/teachers"   class="nav-item {% if '/teachers'   in request.path %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-chalkboard-teacher"></i></span> Teachers
      </a>
      <a href="/admin/attendance" class="nav-item {% if '/attendance' in request.path %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-calendar-check"></i></span> Attendance
      </a>
      <a href="/admin/fees"       class="nav-item {% if '/fees'       in request.path %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-coins"></i></span> Fee System
      </a>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Communication</div>
      <a href="/admin/notices" class="nav-item {% if '/notices' in request.path %}active{% endif %}">
        <span class="nav-icon"><i class="fas fa-bullhorn"></i></span> Notices
      </a>
    </div>
  </nav>

  <div class="sidebar-bottom">
    <a href="/logout" class="user-card">
      <div class="user-avatar">{{ session.username[0]|upper }}</div>
      <div>
        <div class="user-name">{{ session.username }}</div>
        <div class="user-role"><i class="fas fa-sign-out-alt"></i> Sign Out</div>
      </div>
    </a>
  </div>
</aside>

<!-- ===== MAIN CONTENT ===== -->
<div class="main">
  <header class="topbar">
    <button class="hamburger" onclick="openSidebar()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-title">
      <i class="fas fa-angle-right topbar-chevron"></i>
      {% block topbar_title %}{% endblock %}
    </div>
    <div class="topbar-actions">
      {% block topbar_actions %}{% endblock %}
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

<script>
  function openSidebar() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('overlay').classList.add('active');
  }
  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('overlay').classList.remove('active');
  }
</script>
</body>
</html>
